kind: graf_autoresearch
model: Qwen/Qwen3-4B
model_revision: 1cfa9a7208912126459214e8b04321603b3df60c
enable_thinking: true
training_dataset: jasonrqh/Math-CoT-20k
training_dataset_revision: 1435fb21d4fecc8ad4966a26f22a874cf2b527f1
development_benchmark: aime24
locked_benchmarks: [aime25, aime26]
official_samples_per_problem: 12
# Development selection is the directly observed official 12-sample Avg@12.
# Bootstrap intervals remain logged for interpretation, never as a gate.
promotion_min_avg_at_12_delta: 0.0
promotion_requires_positive_ci_lower: false
max_candidates: 24
# First full graph candidate: all accepted rows from this bounded cache are
# viability-scored.  The controller preserves cache/viability cardinality.
graph_cache_problem_limit: 128
# These are safety maxima, not a required number of routes or actions.  The
# graph builder selects a variable arity per problem under the total budget.
max_forks_per_problem: 6
max_actions_per_fork: 6
graph_action_budget: 24
forced_continuations_per_action: 2
allowed_mutations:
  - heldout_diagnostic_fraction
  - full_graph_method
  - graph_mode
  - max_completion_length
  - fork_threshold
  - fork_information_threshold
  - fork_information_quantile
  - information_weighted_routing
  - graph_budget
  - viability_temperature
  - viability_beta_prior
  - recovery_conditioned_routing
  - teacher_graph_critique
  - branch_loss_weight
  - entropy_floor_weight
  - token_divergence
