kind: graf_train
variant: g4_graph_backtrack_entropy_4096
model: Qwen/Qwen3-4B
model_revision: 1cfa9a7208912126459214e8b04321603b3df60c
dataset: jasonrqh/Math-CoT-20k
dataset_revision: 1435fb21d4fecc8ad4966a26f22a874cf2b527f1
enable_thinking: true
student_thinking: true
teacher_thinking: true
fixed_teacher: true
effective_batch_size: 32
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
num_gpus: 4
learning_rate: 5.0e-6
# The first complete GRAF method: answer-masked teacher graph proposals,
# verifier-calibrated student-context viability, recovery actions, and a
# target-adaptive entropy floor over genuinely viable alternatives.
max_completion_length: 4096
max_steps: 50
save_steps: 50
rollouts_per_prompt: 1
temperature: 1.1
top_p: 0.95
top_k: 20
presence_penalty: 0.0
lmbda: 1.0
beta: 0.0
jsd_token_clip: 0.05
exact_jsd_vocab_chunk_size: 4096
tail_logits_only: true
lora_r: 64
lora_alpha: 128
lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
seed: 42
# GRAF candidates reserve a deterministic diagnostic subset, never model-visible.
heldout_diagnostic_fraction: 0.05
graph_mode: viability_routed
branch_loss_weight: 0.10
entropy_floor_weight: 0.90
# Weight every informative action distribution continuously instead of a
# fixed count, static margin, or hand-selected viable/invalid pattern.
information_weighted_routing: true
graph_budget: 24
