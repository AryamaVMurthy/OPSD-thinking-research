[project]
name = "opsd-thinking-research"
version = "0.1.0"
description = "Reproducible thinking-enabled Qwen3 OPSD experiments"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
opsd-research = "opsd_research.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["opsd_research"]
