[project]
name = "opsd-thinking-research"
version = "0.1.0"
description = "Reproducible thinking-enabled Qwen3 OPSD experiments"
requires-python = ">=3.10"
dependencies = [
  "antlr4-python3-runtime==4.11.0",
  "loguru>=0.7.3",
  "PyYAML>=6.0",
  "regex>=2024.11.6",
  "sympy>=1.13.1",
]

[project.scripts]
opsd-research = "opsd_research.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["opsd_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
